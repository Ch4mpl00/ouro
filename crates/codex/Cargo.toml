[package]
name = "codex-service"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
nix = { version = "0.31.3", features = ["signal"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", features = ["full"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
proptest = "1"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile = "3"

[[bin]]
name = "codex-service"
path = "src/main.rs"

# The stand-in `codex` is this test binary under another name, so its main
# is ours (tests/runner.rs).
[[test]]
name = "runner"
harness = false
